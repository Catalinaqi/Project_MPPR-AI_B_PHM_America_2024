# =============================================================================
# DATASET CONFIGURATION
# Single responsibility: Defines WHERE the data resides and HOW to ingest it.
# =============================================================================
datasets:
  phm2024:
    name: "PHM North America 2024 Conference Data Challenge Dataset"
    version: "1.0"
    description: "PHM North America 2024 Conference Data Challenge – complete dataset"

    source:
      url: "https://data.phmsociety.org/phm2024-conference-data-challenge/"

      # -------------------------------------------------------------------------
      # download_executor: Reference to the Python module responsible for
      # Phase 2.1 (Acquisition). Used by the orchestrator for automation.
      # -------------------------------------------------------------------------
      download_extractor_data: "src/phm_america_2024/data/download_extractor_data.py"

    paths:
      train:
        X_TRAIN_FEATURE: "data/raw/train/X_train.csv"
        Y_TRAIN_TARGET: "data/raw/train/Y_train.csv"
      test:
        X_TEST_FEATURE: "data/raw/test/X_test.csv"
      validation:
        X_VALIDATION_FEATURE: "data/raw/validation/X_validation.csv"
    csv_params:
      sep: ","
      encoding: "utf-8"
      decimal: "."
      # -------------------------------------------------------------------------
      # low_memory: false -> CRITICAL. Prevents pandas from inferring mixed dtypes
      # in chunks, which leads to silent data corruption in large GUIDE files.
      # -------------------------------------------------------------------------
      low_memory: false







