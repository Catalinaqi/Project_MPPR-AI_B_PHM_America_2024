# ══════════════════════════════════════════════════════════════════════════════
# PROBABILISTIC REGRESSION PIPELINE CONFIGURATION (TORQUE MARGIN)
# ══════════════════════════════════════════════════════════════════════════════
# CRISP-DM Phases: 3 (Data Preparation), 4 (Modeling), 5 (Evaluation)
# Selected Architecture: NGBoost (Natural Gradient Boosting)
# Core Target: trq_margin (Estimating Conditional Mean \mu and Variance \sigma^2)
# Methodology Requirements: Rigid step layout with explicit method/technique splits
# ══════════════════════════════════════════════════════════════════════════════

regression_pipeline_config:

  metadata:
    pipeline_key:
      task: "regression" #probabilistic_regression
      version: "2.1"
      objective: "Estimate torque margin probability density function under cross-asset domain shift."
      granularity: "flight_sample"

  inherits_from: "base_pipeline_config"

  runtime:
    log_level: "DEBUG"
    warnings_handling:
      gmm_bic_overfit_trigger:
        action: "LOG_WARNING"
        message: "WARNING (BIC not at k=4). Overriding absolute minimum k=6 with physical elbow criterion k=4."

  phases:
    # ----------------------------------------------------------------------------
    # STAGE 2 — DATA UNDERSTANDING
    # ----------------------------------------------------------------------------
    phase2_data_understanding:
      enabled: true

    # ----------------------------------------------------------------------------
    # STAGE 3 — DATA PREPARATION (ISOLATED TO TRAINING MOTORS - STEP MODULARITY)
    # ----------------------------------------------------------------------------
    phase3_data_preparation:
      enabled: true
      objective: "Clean, transform, and internal split ONLY the 4 training motors."

      read_strategy:
        mode: "full_flight_records"
        input_source:
         #train_parquet: "2.1.data_acquisition.*_stratified_train.parquet"
         description: <
           train_parquet -> 2.1.data_acquisition.*_stratified_train.parquet
           Data acquisition step 2.1 x+y train stratified parquet.

      steps:
        # ────────────────────────────────────────────────────────────────────────
        # STEP 3.1: VARIABLE SELECTION
        # ────────────────────────────────────────────────────────────────────────
        step_3_1_data_selection:
          enabled: true
          description: "Filter operational features and remove irrelevant technical variables."
          methods:
            data_selection:
              enabled: true
              techniques:
                dataset_definition:
                  enabled: true
                  params:
                    mode: "full_flight_records"
                    include: [ "oat", "mgt", "pa", "ias", "np", "ng","trq_measured",
                               "trq_margin"]
                    patterns_to_drop: [ "id"]
                  output: "3.1.selection.definition_trace_log.json"
                feature_selection:
                  enabled: true
                  params:
                    remove_constant: true
                    remove_duplicate: true
                  output: "3.1.selection.filter_trace_log.json"

          input_artifact:
            path: "2.1.data_acquisition.prod_3000_stratified_x_y_train.parquet"
          output_artifacts:
            selected_regression_train_parquet:
              path: "3.1.selection.selected_regression_train.parquet"
              description: "Intermediate regression matrix containing only selected operational columns."
              consumed_by: [ "step_3_2_data_cleaning" ]
        # ────────────────────────────────────────────────────────────────────────
        # STEP 3.2: OUTLIER AND DUPLICATE HANDLING (WITH CLIPPING ON TRQ_MARGIN)
        # ────────────────────────────────────────────────────────────────────────
        step_3_2_data_cleaning:
          enabled: true
          description: "Mitigate severe target asymmetries and check training set row duplications."
          methods:
            data_cleaning:
              enabled: true
              techniques:
               # control extra para trq_margin
                outlier_handling:
                  enabled: true
                  params:
                    target_clipping: true
                    target_variable: "trq_margin"
                    lower_percentile: 0.01
                    upper_percentile: 0.99
                  output: "3.2.cleaning.clipping_audit_log.json"
                duplicate_handling:
                  enabled: true
                  params:
                    keep: "first"
                  output: "3.2.cleaning.duplicates_trace.json"

          input_artifact:
            path: "3.1.selection.selected_regression_train.parquet"
            description: "Intermediate regression matrix containing only selected operational columns."
          output_artifacts:
            cleaned_regression_train_parquet:
              path: "3.2.cleaning.cleaned_regression_train.parquet"
              description: "Intermediate regression matrix deduplicated and outlier-clipped."
              consumed_by: [ "step_3_3_data_transformation" ]

        step_3_3_data_engineering:
          enabled: true
          description: ".........."
          methods:
            data_transformation:
              enabled: true
              techniques:
                feature_engineering:
                  enabled: true
                  params:
                    oat_denominator_protection:
                      method: "convert_to_kelvin"
                      offset: 273.15
                    formulas:
                      mgt_oat_ratio: "mgt / (oat + 273.15)"
                      specific_power_index: "np / (ng * (oat + 273.15))" # "np / ((ng + 1e-9) * (oat + 273.15))"
                    interactions:
                      enabled: true
                      degree: 2
                      features: "all"
                  output: "3.3.transformation.engineering_formulas_log.json"
          input_artifact:
            path: "3.2.cleaning.cleaned_regression_train.parquet"
            description: "..."
          output_artifacts:
            engineered_regression_train_parquet:
              path: "3.4.transformation.transformed_regression_train.parquet"
              description: "Intermediate regression matrix with newly engineered physical features."
              consumed_by: [ "step_3_5_data_formatting" ]

        step_3_4_data_formatting:
          enabled: true
          description: "Partition vectors into internal splits (for Phase 4 CV) and cast arrays."
          methods:
            data_formatting:
              enabled: true
              techniques:
                data_split:
                  enabled: true
                  params:
                    test_size: 0.15    # 15% reservado para tu "test_internal" (Fase 5)
                    val_size: 0.15     # 15% reservado para tu "val_internal" (Fase 4)
                    random_state: 42   # Semilla de reproducibilidad (quedará 70% para Train)
                    stratify: false
                    target_col: "trq_margin"
                  output: "3.5.formatting.split_indices_trace.json"
                dataset_formatting:
                  enabled: true
                  params:
                    target_col: "trq_margin"
                    type_casting: "float64" # Target continuo para NGBoost
                    to_numpy: true
                  output: "3.5.formatting.arrays_manifest.json"

          input_artifact:
            path: "3.4.transformation.transformed_regression_train.parquet"
            description: "........."
          output_artifacts:
            engineered_train_split:
              path: "3.5.formatting.regression_internal_train.parquet"
              description: "Finalized scaling-safe internal training matrix for NGBoost."
              consumed_by: [ "phase4_data_modeling" ]
            engineered_val_split:
              path: "3.5.formatting.regression_internal_val.parquet"
              description: "Finalized internal validation split for NGBoost early stopping/CV."
              consumed_by: [ "phase4_data_modeling", "phase5_evaluation_and_interpretation" ]
            engineered_test_split:
              path: "3.5.formatting.regression_internal_test.parquet"
              description: "Finalized internal test split."
              consumed_by: [ "phase4_data_modeling", "phase5_evaluation_and_interpretation" ]

        # ────────────────────────────────────────────────────────────────────────
        # STEP 3.3: ESCALADO TRANQUILO E INGENIERÍA FÍSICA DE VARIABLES
        # ────────────────────────────────────────────────────────────────────────
        step_3_5_data_transformation:
          enabled: true
          description: "Inject robust scaling and protected non-linear aero-thermodynamic KPIs."
          methods:
            data_transformation:
              enabled: true
              techniques:
                feature_scaling:
                  enabled: true
                  params:
                    method: "RobustScaler"
                    fit_on_train_only: true
                    features: [ "oat", "mgt", "pa", "ias", "np", "ng", "trq_measured","trq_margin", "mgt_oat_ratio" ,"specific_power_index"]
                  output: "3.3.transformation.scaler_fit_trace.json"
          input_artifact:
            path: "3.5.formatting.regression_internal_train.parquet"
            description: "..."
          output_artifacts:
            transformed_regression_train_parquet:
              path: "3.3.transformation.transformed_regression_train.parquet"
              description: "Intermediate regression matrix with scaling applied and newly engineered physical features."
              consumed_by: [ "step_3_5_data_formatting" ]
            fitted_scaler_regression_artifact:
              path: "3.3.transformation.robust_scaler_regression.pkl"
              description: "Fitted state parameters of the training-isolated RobustScaler model for regression."
              consumed_by: [ "phase4_data_modeling", "phase5_evaluation_and_interpretation" ]

    # ----------------------------------------------------------------------------
    # STAGE 4 — MODELING (PROBABILISTIC DENSITY ESTIMATION)
    # ----------------------------------------------------------------------------
    phase4_data_modeling:
      enabled: true
      objective: "Train NGBoost over simulated operational flight envelope groups to isolate engine-asset features."

      # [REGLA 3] DAG Traceability: Insumos de la Fase 3
      read_strategy:
        mode: "consume_engineered_splits"
        input_source:
          train_data: "3.3.transformation.transformed_regression_train.parquet"
          val_data: "3.5.formatting.regression_internal_val.parquet"
          scaler: "3.3.transformation.robust_scaler_regression.pkl"

      steps:
        step_4_1_algorithm_selection:
          enabled: true
          description: "Configure NGBoost to output Normal distribution parameters."
          methods:
            algorithm_selection:
              enabled: true
              techniques:
                single_probabilistic_architecture:
                  enabled: true
                  params:
                    library: "ngboost"
                    estimator: "NGBRegressor"
                    Dist: "Normal" # Predice Media y Varianza (Incertidumbre)
                    Score: "LogScore" # Optimiza para que la incertidumbre sea realista
                    n_estimators: 400        # <--- Buen balance entre aprendizaje y velocidad
                    learning_rate: 0.03     # <--- Tasa de aprendizaje estándar
                    minibatch_frac: 0.1    # <--- CLAVE: Toma solo el 10% de los datos por árbol. ¡Súper rápido!
                    Base:
                      type: "DecisionTreeRegressor"
                      max_depth: 4         # <--- Árboles poco profundos, previene memorización
                      min_samples_leaf: 30  # 20
                    random_state: 42
                  output: "4.1.modeling.algo_setup_trace.json"

        step_4_2_model_training:
          enabled: true
          description: "Execute GMM-grouped cross validation."
          methods:
            model_training:
              enabled: true
              techniques:
                cross_validation:
                  enabled: true
                  params:
                    random_seed: 7
                    strategy: "GroupKFold"
                    target_variable: "trq_margin"
                    n_splits: 5
                    grouping_mechanism:
                      type: "GMM_Clusterer"
                      features: [ "oat", "mgt", "ias" ]
                      n_clusters: 5
                      covariance_type: "full"
                      log_centroids_verification: true
                  output: "4.2.training.cv_fold_execution_trace.json"
          #input_artifact:
           #path: "3.5.formatting.regression_internal_train.parquet"
          output_artifacts:
            # trained_ngboost_model:
            trained_model:
              path: "4.2.training.ngboost_regressor.pkl"
              description: "Fitted NGBoost parameters structure ready for variance forecasting inference."
              consumed_by: [ "step_4_4_model_evaluation", "phase5_evaluation_and_interpretation" ]

        step_4_4_model_evaluation:
          enabled: true
          description: "Select best model using Negative Log-Likelihood (NLL)."
          methods:
            model_evaluation:
              enabled: true
              techniques:
                model_selection_criteria:
                  enabled: true
                  params:
                    primary_metric: "neg_log_likelihood"
                    tie_breaker: "rmse"
                  output: "4.4.evaluation.ranking_trace.json"
          #input_artifact:
           #ngboost_pkl: "4.2.training.ngboost_regressor.pkl"
           #internal_val_parquet: "3.5.formatting.regression_internal_val.parquet"
          output_artifacts:
            best_regression_model_metadata:
              path: "4.4.evaluation.final_best_model_meta.json"
              description: "Consolidated performance scoreboard isolating validation likelihood outcomes."
              consumed_by: [ "phase5_evaluation_and_interpretation" ]

    # ----------------------------------------------------------------------------
    # STAGE 5 — EVALUATION & UNCERTAINTY INTERPRETATION
    # ----------------------------------------------------------------------------
    phase5_evaluation_and_interpretation:
      enabled: true
      objective: "Verify prediction interval calibration honesty on UNSEEN CROSS-ASSET MOTORS."

      # ¡CORRECCIÓN CRÍTICA APLICADA! Carga el scaler, modelo y los DATOS DEL CHALLENGE CRUDOS
      read_strategy:
        mode: "cross_asset_evaluation"
        input_source:
          model: "4.2.training.ngboost_regressor.pkl"
          scaler: "3.3.transformation.robust_scaler_regression.pkl"
          metadata: "4.4.evaluation.final_best_model_meta.json"
          internal_test_data: "3.5.formatting.regression_internal_test.parquet" ## ¿Por qué el modelo es bueno/malo?

      steps:
        step_5_1_interpretation:
          enabled: true
          description: "Extract feature coefficients mapping the behavior of both Mu and Sigma sub-trees."
          methods:
            model_interpretation:
              enabled: true
              techniques:
                feature_importance:
                  enabled: true
                  params:
                    strategy: "model_native"
                    top_k: 15
                  output: "5.1.interpretation.plots.feature_importance_data.json"
                permutation_importance:
                  enabled: true
                  params:
                    n_repeats: 5
                    scoring: "neg_log_likelihood"
                  output: "5.1.interpretation.plots.permutation_data.json"
          output_artifacts:
            fi_importance_plot:
              path: "5.1.interpretation.plots.feature_importance.png"
              description: "Top 15 features by ensemble contribution."
              consumed_by: [ "report_generator" ]
            fi_permutation_plot:
              path: "5.1.interpretation.plots.permutation_importance.png"
              description: "Feature importance via target permutation."
              consumed_by: [ "report_generator" ]
        # step_5_2_probabilistic_evaluation
        step_5_2_business_evaluation:
          enabled: true
          description: "Audit true target hit counts inside prediction boundaries on hidden test motors."
          methods:
            probabilistic_evaluation:
              enabled: true
              techniques:
                calibration_audit:
                  enabled: true
                  params:
                    intervals: [ 0.10, 0.50, 0.90 ]
                  output: "5.2.evaluation.intervals_trace.json"
                performance_degradation_benchmarking:
                  enabled: true
                  params:
                    expect_test_degradation: true
                    baseline: "naive_mean"
                  output: "5.2.evaluation.degradation_trace.json"
          output_artifacts:
            evaluation_summary_json:
              path: "5.2.evaluation.final_regression_metrics_summary.json"
              description: "Final consolidated regression score sheet mapping NLL, RMSE, and interval coverages on hidden motors."
              consumed_by: [ "deployment" ]
            # --- Plots (PNG) ---
            eval_calibration_plot:
              path: "5.2.plots.calibration_curve.png"
              description: "Reliability diagram mapping calibration honesty."
              consumed_by: [ "report_generator", "quality_audit" ]
            eval_degradation_plot:
              path: "5.2.plots.degradation_comparison.png"
              description: "Benchmark comparison against naive_mean baseline."
              consumed_by: [ "report_generator", "quality_audit" ]

        step_5_3_process_audit:
          enabled: true
          description: "Run automated compliance traces on the transformation pipeline."
          methods:
            process_audit:
              enabled: true
              techniques:
                leakage_detection:
                  enabled: true
                  params:
                    checks: [ "train_test_overlap", "scaler_contamination_check" ]
                  output: "5.3.audit.leakage_trace.json"

        step_5_4_decision_making:
          enabled: true
          description: "Subject pipeline execution artifacts to engineering domain specialist reviews."
          methods:
            decision_making:
              enabled: true
              techniques:
                final_sign_off:
                  enabled: true
                  params:
                    required_review: true
                    review_roles: [ "preventive_maintenance_engineer" ]
                  output: "5.4.decision.sign_off_trace.json"
          output_artifacts:
            deployment_sign_off:
              path: "5.4.decision.final_sign_off_certificate.json"
              description: "Cryptographic or structured approval marker for production release."
              consumed_by: [ "deployment" ]

    phase6_deployment:
      enabled: true
      objective: "Eseguire l'inferenza unificata sui test set interni e pacchettizzare i consegnabili per la valutazione accademica."

#      read_strategy:
#        mode: "academic_evaluation"
#        input_source:
#          # --- Modelli pre-addestrati ---
#          classification_model: "4.2.training.lightgbm_raw_classifier.pkl"
#          regression_model: "4.2.training.ngboost_regressor.pkl"
#          classification_calibrator: "4.2.training.isotonic_calibrator.pkl"
#
#          # --- Dataset di Test e Train Interni (Generati nella Fase 3.5) ---
#          # Nota: cascade_inference userà solo i test set, zip_delivery userà tutto.
#          classification_test_data: "3.5.formatting.classification_internal_test.parquet"
#          regression_test_data: "3.5.formatting.regression_internal_test.parquet"
#          classification_train_data: "3.5.formatting.classification_internal_train.parquet"
#          regression_train_data: "3.5.formatting.regression_internal_train.parquet"
      read_strategy:
        mode: "academic_evaluation"
        input_source:
          # --- Modelli pre-addestrati ---
          # Usamos el timestamp correcto y la subcarpeta phase4_data_modeling
          classification_model: "../../../classification/phm2024/20260621_160737/phase4_data_modeling/4.2.training.lightgbm_raw_classifier.pkl"
          classification_calibrator: "../../../classification/phm2024/20260621_160737/phase4_data_modeling/4.2.training.isotonic_calibrator.pkl"

          # El modelo de regresión en la carpeta local phase4_data_modeling
          regression_model: "phase4_data_modeling/4.2.training.ngboost_regressor.pkl"

          # --- Dataset di Test e Train Interni ---
          # Buscamos los datos de clasificación en su phase3_data_preparation
          classification_test_data: "../../../classification/phm2024/20260621_160737/phase3_data_preparation/3.5.formatting.classification_internal_test.parquet"
          classification_train_data: "../../../classification/phm2024/20260621_160737/phase3_data_preparation/3.5.formatting.classification_internal_train.parquet"

          # Buscamos los datos de regresión locales
          regression_test_data: "phase3_data_preparation/3.5.formatting.regression_internal_test.parquet"
          regression_train_data: "phase3_data_preparation/3.5.formatting.regression_internal_train.parquet"

      steps:
        step_6_1_academic_scoring:
          enabled: true
          description: "Eseguire i modelli solo sulle partizioni di Test interno per ottenere le predizioni finali."
          methods:
            batch_scoring:
              enabled: true
              techniques:
                cascade_inference:
                  enabled: true # Al mismo nivel que params
                  params:
                    execution_order: ["classification", "regression"]
                    filter_threshold: 0.5
                    save_predictions: true
                    datasets_to_score:
                      - "classification_test_data"
                      - "regression_test_data"
                  output: "6.1.final_academic_predictions.parquet"

        step_6_2_package_deliverables:
          enabled: true
          description: "Copiare il codice, i modelli e i dataset utilizzati (Train e Test) in un file ZIP per il professore."
          methods:
            package_delivery:
              enabled: true
              techniques:
                zip_delivery:
                  enabled: true # Al mismo nivel que params
                  params:
                    include_code: true
                    files_to_include:
                      - "3.5.formatting.classification_internal_train.parquet"
                      - "3.5.formatting.classification_internal_test.parquet"
                      - "3.5.formatting.regression_internal_train.parquet"
                      - "3.5.formatting.regression_internal_test.parquet"
                      - "6.1.final_academic_predictions.parquet"
                  output: "Consegna_PHM_America_2024.zip"
