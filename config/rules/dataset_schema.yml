dataset_schema:
  # ── CONFIRMED DATASET SIZES (from DuckDB COUNT queries) ─────────────────
  # df_train:      742,625 rows  — 94.54% of total — has X and Y labels
  # df_validation:  21,436 rows  —  2.73% of total — X only, no Y labels
  # df_test:        21,436 rows  —  2.73% of total — X only, no Y labels
  # Total:         785,497 rows
  # ─────────────────────────────────────────────────────────────────────────
  dataset_sizes:
    train:      742 625 # settecento quaranta due mila seicento venti cinque
    validation: 21 436 # ventuno mila quattro cento trenta sei
    test:       21 436 # ventuno mila quattro cento trenta sei
    total:      785 497
    train_pct:  94.54
    val_pct:    2.73
    test_pct:   2.73

  # ── GRUPPO 1: METADATI DEI CAMPI (Significato Fisico Inglese / Italiano) ─
  fields_metadata:
    id:           {en: "Identifier",                         it: "Identificativo Record"}
    #--------------------------------------------------------------------------------------
    # 1. rappresentano l'ambiente e il regime di volo -> variabili atmosferiche + velocità termica
    # 2. variabili ambientali -> rappresentano le condizioni esterne in termini termici/aerodinamici
    # 3. Il GMM raggruppa i dati in base all'ambiente e induce il modello ML a imparare come reagiscono le variabili di prestazione
    #--------------------------------------------------------------------------------------
    oat:          {en: "Outside Air Temperature (Celsius)",  it: "Temperatura Aria Esterna (Celsius)"}
    mgt:          {en: "Measured Gas Temp (°C)",             it: "Temperatura del Gas Misurata (°C)"}
    ias:          {en: "Indicated Airspeed (Nodi)",          it: "Velocità Indicata (Nodi)"}
    #--------------------------------------------------------------------------------------
    # 1. rappresentano la dinamica interna e il rendimento meccanico
    # 2. variabili di rendimento
    # 3. Il GMM raggruppa i dati per ambiente e costringe il modello ML a imparare
    #--------------------------------------------------------------------------------------
    pa:           {en: "Pressure Altitude (Piedi)",          it: "Altitudine di Pressione (Piedi)"}
    ng:           {en: "Gas Generator Speed (%)",            it: "Velocità del Generatore di Gas (%)"}
    np:           {en: "Power Turbine Speed (%)",            it: "Velocità della Turbina di Potenza (%)"}
    trq_measured: {en: "Measured Torque (%)",                it: "Coppia Reale Misurata (%)"}
    #----------------target
    faulty:       {en: "Faulty Indicator (0=Nominal, 1=Fail)",it: "Indicatore di Guasto (0=Nominale, 1=Guasto)"}
    trq_margin:   {en: "Torque Margin (%)",                  it: "Margine di Coppia (%)"}

  # ── CONFIRMED COLUMN SCHEMA (from DESCRIBE df_train) ────────────────────
  # All feature columns are DOUBLE and nullable.
  # id and faulty are BIGINT.
  # No datetime columns — data is shuffled, no temporal order exists.
  # ─────────────────────────────────────────────────────────────────────────
  confirmed_schema:
    columns:
      id:           {type: BIGINT,  role: identifier,             nullable: true}
      trq_measured: {type: DOUBLE,  role: feature,                nullable: true,  note: "Coppia Reale Misurata (%)"}
      oat:          {type: DOUBLE,  role: feature,                nullable: true,  note: "Outside Air Temperature (Celsius)"}
      mgt:          {type: DOUBLE,  role: feature,                nullable: true,  note: "Measured Gas Temp (°C)"}
      pa:           {type: DOUBLE,  role: feature,                nullable: true,  note: "Pressure Altitude (Piedi)"}
      ias:          {type: DOUBLE,  role: feature,                nullable: true,  note: "Indicated Airspeed (Nodi)"}
      np:           {type: DOUBLE,  role: feature,                nullable: true,  note: "Power Turbine Speed (%)"}
      ng:           {type: DOUBLE,  role: feature,                nullable: true,  note: "Gas Generator Speed (%)"}
      faulty:       {type: BIGINT,  role: target_classification,  nullable: true,  note: "Binary label: 0=nominal, 1=faulty"}
      trq_margin:   {type: DOUBLE,  role: target_regression,      nullable: true,  note: "Margine di Coppia (%)"}

  confirmed_schema_old:
    columns:
      id: { type: BIGINT,  role: identifier,             nullable: true }
      trq_measured: { type: DOUBLE,  role: feature,                nullable: true,  note: "Real-time measured torque" }
      oat: { type: DOUBLE,  role: feature,                nullable: true,  note: "Outside air temperature — can be negative, Kelvin shift required in Phase 3" }
      mgt: { type: DOUBLE,  role: feature,                nullable: true,  note: "Mean gas temperature" }
      pa: { type: DOUBLE,  role: feature,                nullable: true,  note: "Power available" }
      ias: { type: DOUBLE,  role: feature,                nullable: true,  note: "Indicated airspeed" }
      np: { type: DOUBLE,  role: feature,                nullable: true,  note: "Net power" }
      ng: { type: DOUBLE,  role: feature,                nullable: true,  note: "Compressor speed — min confirmed 90.00, no zero-division risk" }
      faulty: { type: BIGINT,  role: target_classification,  nullable: true,  note: "Binary label: 0=nominal, 1=faulty" }
      trq_margin: { type: DOUBLE,  role: target_regression,      nullable: true,  note: "Torque margin % — heavy negative skew confirmed (-2.75)" }