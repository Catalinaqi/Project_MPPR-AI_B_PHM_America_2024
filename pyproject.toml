[project]
name = "project-manutenzione_preventiva_per_la_robotica_e_la_automazione_intelligente"
version = "0.1.0"
description = "..."
authors = [
    {name = "Catalinaqi",email = "ccequispe@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "duckdb (>=1.5.3,<2.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "ngboost (>=0.5.10,<0.6.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = true
packages = [
    { include = "phm_america_2024", from = "src" }
]
[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.2.2"
omegaconf = "^2.3.0"

